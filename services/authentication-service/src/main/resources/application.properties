# Server Configuration
server.port=8081

# --- Database Configuration (PostgreSQL) ---
# Use environment variables for Docker compatibility
# Using auth_schema in cibf_db database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cibf_db}?currentSchema=auth_schema&tcpKeepAlive=true&socketTimeout=30&connectTimeout=10
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Connection Pool Configuration (HikariCP) ---
# Prevent connection timeouts and improve stability
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000

# --- JPA/Hibernate Configuration ---
# Create or update tables automatically (great for development)
spring.jpa.hibernate.ddl-auto=update 
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Explicitly set default schema
spring.jpa.properties.hibernate.default_schema=auth_schema
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.cibf=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# Show detailed error messages (DISABLE IN PRODUCTION)
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=true

# --- JWT Configuration (Needed for JwtTokenProvider) ---
# 512-bit (64-byte) Base64-encoded secret key for HS512 algorithm
# Use environment variable with fallback to default
app.jwt-secret=${JWT_SECRET:JE6WwDKZ8uMOOwt+XnkQTPvb2sj0BD58Kc1WwxTHfVaB7otOwANuKKhbGPvKjA6hDyo0y7qls24Irt6rHLINEA==}
# 24 hours in milliseconds
app.jwt-expiration-milliseconds=86400000

# Service URLs for inter-service communication
reservation.service.url=http://localhost:8083
user.service.url=http://localhost:8086

