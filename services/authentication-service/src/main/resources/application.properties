# Server Configuration
server.port=8081

# --- Database Configuration (PostgreSQL) ---
# AWS RDS Configuration
spring.datasource.url=jdbc:postgresql://cibf-database.cj4yusc4c0b4.us-west-2.rds.amazonaws.com:5432/cibf_db?currentSchema=auth_schema
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool settings (important for RDS)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# --- JPA/Hibernate Configuration ---
# Create or update tables automatically (great for development)
spring.jpa.hibernate.ddl-auto=update 
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Explicitly set default schema
spring.jpa.properties.hibernate.default_schema=auth_schema
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.cibf=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN

# Show detailed error messages (DISABLED FOR PRODUCTION)
server.error.include-message=always
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# --- JWT Configuration ---
# 512-bit (64-byte) Base64-encoded secret key for HS512 algorithm
app.jwt-secret=JE6WwDKZ8uMOOwt+XnkQTPvb2sj0BD58Kc1WwxTHfVaB7otOwANuKKhbGPvKjA6hDyo0y7qls24Irt6rHLINEA==
# 24 hours in milliseconds
app.jwt-expiration-milliseconds=86400000

# Service URLs for inter-service communication (Docker network)
reservation.service.url=http://reservation-service:8083
user.service.url=http://user-service:8086

# Health check endpoint
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# RabbitMQ Configuration
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:changeme123}
spring.rabbitmq.connection-timeout=30000
spring.rabbitmq.requested-heartbeat=60
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.initial-interval=1000
spring.rabbitmq.template.retry.max-attempts=3
spring.rabbitmq.template.retry.multiplier=2
