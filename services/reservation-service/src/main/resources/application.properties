# Server Configuration
server.port=8083

# --- Database Configuration (PostgreSQL) ---
# Use environment variables for Docker compatibility
# Using auth_schema in cibf_db database
spring.datasource.url=${RESERVATION_DB_URL:jdbc:postgresql://localhost:5432/cibf_db?currentSchema=reservation_schema}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA/Hibernate Configuration ---
# Create or update tables automatically (great for development)
spring.jpa.hibernate.ddl-auto=update 
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Explicitly set default schema
spring.jpa.properties.hibernate.default_schema=reservation_schema

# Service URLs
stall.service.url=${STALL_SERVICE_URL:http://localhost:8082}

# ===================================
# 📧 GMAIL SMTP CONFIGURATION
# ===================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:info.cibf@gmail.com}
spring.mail.password=${GMAIL_APP_PASSWORD:mpcggwvlillvtsmt}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Email Settings
app.email.from=${GMAIL_USERNAME:info.cibf@gmail.com}
app.email.from-name=CIBF Reservation System

# ===================================
# 📦 AWS S3 CONFIGURATION
# ===================================
aws.region=us-west-2
aws.s3.bucket-name=cibf-qr-codes-2025
aws.s3.qr-folder=qr-codes

# Application
app.name=Colombo International Bookfair
app.venue=BMICH, Colombo 07, Sri Lanka
app.organizer=Sri Lanka Book Publishers' Association


# Logging Configuration
logging.level.root=INFO
logging.level.com.cibf=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# Show detailed error messages (DISABLE IN PRODUCTION)
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=true

