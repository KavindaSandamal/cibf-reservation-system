# Server Configuration
server.port=8082

# AWS RDS Configuration
spring.datasource.url=jdbc:postgresql://cibf-database.cj4yusc4c0b4.us-west-2.rds.amazonaws.com:5432/cibf_db?currentSchema=stall_schema
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=stall_schema

# Logging Configuration
logging.level.root=INFO
logging.level.com.cibf=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# Show detailed error messages (DISABLE IN PRODUCTION)
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=true

# --- JWT Configuration (Needed for JwtTokenProvider) ---
# 512-bit (64-byte) Base64-encoded secret key for HS512 algorithm
# Use environment variable with fallback to default
app.jwt-secret=${JWT_SECRET:JE6WwDKZ8uMOOwt+XnkQTPvb2sj0BD58Kc1WwxTHfVaB7otOwANuKKhbGPvKjA6hDyo0y7qls24Irt6rHLINEA==}
# 24 hours in milliseconds
app.jwt-expiration-milliseconds=86400000

# Health check
management.endpoints.web.exposure.include=health,info